function currentEra(x) {
  let e = ERAS[0];
  for (const era of ERAS) { if (x >= era.start) e = era; }
  return e;
}
function nextEra(x) {
  for (let i = 0; i < ERAS.length; i++) { if (x < ERAS[i].start) return ERAS[i]; }
  return null;
}
function eraBlend(x) {
  const cur = currentEra(x);
  const nxt = nextEra(x);
  if (!nxt) return { era: cur, next: cur, t: 0 };
  const dist = nxt.start - x;
  const blendWindow = 120;
  if (dist > blendWindow) return { era: cur, next: nxt, t: 0 };
  return { era: cur, next: nxt, t: 1 - dist / blendWindow };
}
function lerpColor(a, b, t) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const ar=(pa>>16)&255, ag=(pa>>8)&255, ab=pa&255;
  const br=(pb>>16)&255, bg=(pb>>8)&255, bb=pb&255;
  const r = Math.round(ar + (br-ar)*t);
  const g = Math.round(ag + (bg-ag)*t);
  const b2= Math.round(ab + (bb-ab)*t);
  return `rgb(${r},${g},${b2})`;
}

function bindBtn(id, key) {
  const el = document.getElementById(id);

  el.addEventListener('touchstart', e=>{ e.preventDefault(); set(true)(); }, {passive:false});
  el.addEventListener('touchend',   e=>{ e.preventDefault(); set(false)(); }, {passive:false});
  el.addEventListener('touchcancel',e=>{ e.preventDefault(); set(false)(); }, {passive:false});
  el.addEventListener('mousedown',  set(true));
  el.addEventListener('mouseup',    set(false));
  el.addEventListener('mouseleave', set(false));
}

  if (e.key===' ' || e.key==='ArrowUp' || e.key==='w') { if(!input.jump) input.jumpPressed = true; input.jump = true; }
});
window.addEventListener('keyup', e=>{
  if (e.key==='ArrowLeft' || e.key==='a') input.left = false;
  if (e.key==='ArrowRight' || e.key==='d') input.right = false;

});

function px(x, y, w, h, color) { ctx.fillStyle = color; ctx.fillRect(x, y, w, h); }

function spr(grid, x, y, palette, flipX=false) {
  for (let r=0; r<grid.length; r++){
    const row = grid[r];
    for (let c=0; c<row.length; c++){
      const ch = row[c];
      if (ch===' '||ch==='.') continue;
      const col = palette[ch];
      if (!col) continue;
      const dx = flipX ? (grid[0].length - 1 - c) : c;
      ctx.fillStyle = col;
      ctx.fillRect(x + dx, y + r, 1, 1);
    }
  }
}

  px(x,    gy-16, 28, 12, '#f4c020');

  px(x+30, gy-10, 6, 4, '#a0d8e8');
  px(x+3,  gy-2, 5, 3, '#1a1a1a');
  px(x+18, gy-2, 5, 3, '#1a1a1a');
  px(x+30, gy-2, 5, 3, '#1a1a1a');
  ctx.fillStyle='#1a1a1a'; ctx.font='bold 6px monospace';
  ctx.fillText('BÖGL', x+4, gy-13);
}

function drawGate(x, gy) {
  const stoneA = '#d8c8a0', stoneB = '#b8a880';
  px(x, gy-50, 60, 50, stoneA);
  for (let i=0;i<4;i++) px(x+8+i*12, gy-44, 6, 38, stoneB);
  px(x+6, gy-58, 48, 8, stoneA);
  px(x+24, gy-66, 12, 8, '#3a3a3a');
  px(x+22, gy-63, 16, 3, '#3a3a3a');
}

function drawBanner(x, gy) {
  px(x, gy-60, 80, 22, '#ffd700');
  px(x, gy-60, 80, 2, '#caa030');
  px(x, gy-40, 80, 2, '#caa030');
  ctx.fillStyle='#a83030'; ctx.font='bold 16px monospace'; ctx.textAlign='center';
  ctx.fillText('JOSEF · 70', x+40, gy-58);
  px(x-4, gy-66, 88, 1, '#3a3a3a');
}

function drawTinyPerson(x, gy, palOverride) {
  const pal = Object.assign({}, JOSEF_PAL, palOverride||{});
  const grid = [
    "..HHHH..",
    ".HKKKKH.",
    ".HKKKKH.",
    "..KKKK..",
    ".WWWWWW.",
    ".WWWWWW.",
    ".BBBBBB.",
    ".BBBBBB.",
    "..B..B..",
    "..K..K..",
    "..N..N..",
    "..S..S..",
  ];
  spr(grid, x, gy-12, pal);
}

function drawDorothee(x, gy) {
  const pal = { H:'#a05030', K:'#f4caa0', W:'#f4f4f4', B:'#a83060', N:'#e8d8a0', S:'#5a3a20' };
  drawTinyPerson(x, gy, pal);
  px(x+2, gy-7, 4, 2, '#ffffff');
  ctx.fillStyle='#fff'; ctx.font='bold 6px monospace'; ctx.textAlign='center';
  ctx.fillText('Dorothee', x+4, gy-18);
}
function drawMartin(x, gy) {
  const pal = { H:'#caa050', K:'#f4caa0', W:'#3464a8', B:'#3a3a3a', N:'#e8d8a0', S:'#3a2410' };
  drawTinyPerson(x, gy, pal);
  ctx.fillStyle='#fff'; ctx.font='bold 6px monospace'; ctx.textAlign='center';
  ctx.fillText('Martin', x+4, gy-18);
}
function drawHannah(x, gy) {
  const pal = { H:'#caa030', K:'#f4caa0', W:'#e88aa8', B:'#a83060', N:'#e8d8a0', S:'#caa030' };
  drawTinyPerson(x, gy+2, pal);
  ctx.fillStyle='#fff'; ctx.font='bold 6px monospace'; ctx.textAlign='center';
  ctx.fillText('Hannah', x+4, gy-16);
}
function drawLinda(x, gy) {
  const pal = { H:'#7a4a20', K:'#f4caa0', W:'#a0e8a0', B:'#3464a8', N:'#e8d8a0', S:'#5a3a20' };
  drawTinyPerson(x, gy+2, pal);
  ctx.fillStyle='#fff'; ctx.font='bold 6px monospace'; ctx.textAlign='center';
  ctx.fillText('Linda', x+4, gy-16);
}
function drawLurch(x, gy) {
  px(x, gy-4, 22, 4, '#caa030');
  px(x+2, gy-6, 18, 2, '#caa030');
  px(x+20, gy-3, 4, 2, '#caa030');
  px(x+3, gy-5, 1, 1, '#000');
  px(x+5, gy-5, 1, 1, '#000');
  px(x+8, gy-5, 2, 1, '#7a3a10');
  px(x+14, gy-5, 2, 1, '#7a3a10');
}

function drawObstacle(o, gy) {
  if (o.kind === 'stone') {
    px(o.x, gy-o.h, o.w, o.h, '#888');
    px(o.x, gy-o.h, o.w, 2, '#aaa');
    px(o.x, gy-2, o.w, 2, '#666');
  } else if (o.kind === 'parcel') {
    px(o.x, gy-o.h, o.w, o.h, '#b88858');
    px(o.x+2, gy-o.h+2, o.w-4, 2, '#d8a878');
    px(o.x, gy-o.h/2-1, o.w, 2, '#e8d8a0');
    px(o.x+o.w/2-1, gy-o.h, 2, o.h, '#e8d8a0');
  } else if (o.kind === 'parcelStack') {
    px(o.x, gy-12, o.w, 12, '#b88858');
    px(o.x+1, gy-24, o.w-2, 12, '#d89868');
    px(o.x+2, gy-o.h, o.w-4, o.h-24, '#b88858');
  } else if (o.kind === 'concrete') {
    px(o.x, gy-o.h, o.w, o.h, '#a0a0a0');
    px(o.x, gy-o.h, o.w, 2, '#c0c0c0');
    px(o.x+2, gy-o.h+4, o.w-4, 2, '#888');
    px(o.x+2, gy-o.h+8, o.w-4, 2, '#888');
  } else if (o.kind === 'crater') {
    px(o.x, gy-2, o.w, 2, '#3a3a3a');
    px(o.x+2, gy-4, o.w-4, 2, '#5a5a5a');
  } else if (o.kind === 'wall') {
    for (let i=0;i<o.h;i+=6) {
      px(o.x, gy-o.h+i, o.w, 5, i%12===0 ? '#d0d0d0':'#b8b8b8');
    }
    px(o.x+2, gy-o.h+8, 3, 3, '#c83030');
    px(o.x+6, gy-o.h+12, 3, 3, '#3464a8');
    px(o.x+3, gy-o.h+18, 4, 2, '#caa030');
  }
}

function drawCake(x, gy) {
  px(x-4,  gy-2,  40, 2,  '#caa030');
  px(x,    gy-14, 32, 12, '#f4e8c8');
  px(x+2,  gy-20, 28, 6,  '#e8a8c8');
  px(x+4,  gy-30, 24, 10, '#f4e8c8');
  px(x+6,  gy-34, 20, 4,  '#e8a8c8');
  for (let i=0;i<7;i++){
    const cx = x+6 + i*3;
    px(cx, gy-40, 1, 6, '#3464a8');
    px(cx, gy-42, 1, 2, '#ffaa20');
    px(cx-1, gy-41, 3, 1, '#ffe080');
  }
  ctx.fillStyle='#a83030'; ctx.font='bold 10px monospace'; ctx.textAlign='center';
  ctx.fillText('70', x+16, gy-7);
}

const clouds = [];
for (let i=0;i<24;i++) clouds.push({ x: Math.random()*WORLD_END, y: 14 + Math.random()*40, w: 16+Math.random()*22 });
const stars = [];
for (let i=0;i<60;i++) stars.push({ x: 1200 + Math.random()*700, y: 10 + Math.random()*80 });

function drawCloud(c, camX) {
  const x = c.x - camX*0.4;
  if (x + c.w < -10 || x > VIEW_W+10) return;
  px(x, c.y, c.w, 4, '#ffffff');
  px(x+2, c.y-2, c.w-4, 2, '#ffffff');
  px(x+4, c.y+4, c.w-8, 2, '#e8e8f0');
}
function drawMountains(camX) {
  const baseY = VIEW_H - GROUND_H;
  ctx.fillStyle = '#6a7a98';
  for (let i=0;i<10;i++){
    const mx = (i*180 - (camX*0.2 % 180)) | 0;
    const h = 40 + (i%3)*8;
    ctx.beginPath();
    ctx.moveTo(mx, baseY);
    ctx.lineTo(mx+40, baseY - h);
    ctx.lineTo(mx+90, baseY);
    ctx.closePath();
    ctx.fill();
  }
  ctx.fillStyle = '#3a5a3a';
  for (let i=0;i<12;i++){
    const mx = (i*120 - (camX*0.4 % 120)) | 0;
    const h = 22 + (i%2)*8;
    ctx.beginPath();
    ctx.moveTo(mx, baseY);
    ctx.lineTo(mx+30, baseY - h);
    ctx.lineTo(mx+70, baseY);
    ctx.closePath();
    ctx.fill();
  }
}

let camX = 0;
let score = 0;
let prevTime = 0;
let running = false;
let finished = false;

function showToast(msg, dur=1400) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>toastEl.classList.remove('show'), dur);
}

let lastEraName = '';
function updateEraLabel() {
  const e = currentEra(player.x).name;
  if (e !== lastEraName) {
    lastEraName = e;
    hudEra.textContent = e;
    showToast(e, 1600);
  }
}

function update(dt) {
  let ax = 0;
  if (input.left) ax -= 1;
  if (input.right) ax += 1;
  player.vx = ax * RUN_SPEED;
  if (ax > 0) player.facing = 1;
  else if (ax < 0) player.facing = -1;

  if (player.onGround && input.jumpPressed) {
    player.vy = JUMP_V;
    player.onGround = false;
  }
  input.jumpPressed = false;

  if (!input.jump && player.vy < -3) player.vy = -3;

  player.vy += GRAVITY;
  if (player.vy > 12) player.vy = 12;

  player.x += player.vx;
  player.y += player.vy;

  if (Math.abs(player.vx) > 0.1) player.walkPhase += Math.abs(player.vx) * 0.18;

  if (player.x < 0) player.x = 0;
  if (player.x > WORLD_END - player.w) player.x = WORLD_END - player.w;

  const gy = VIEW_H - GROUND_H;
  if (player.y + player.h >= gy) {
    player.y = gy - player.h;
    player.vy = 0;
    player.onGround = true;
  } else {
    player.onGround = false;
  }

  if (player.hurtT > 0) player.hurtT -= dt;
  for (const o of things) {
    if (o.type !== 'obstacle') continue;
    const oy = gy - o.h;
    if (player.x + player.w > o.x && player.x < o.x + o.w &&
        player.y + player.h > oy && player.y < oy + o.h) {
      const playerBottomPrev = (player.y + player.h) - player.vy;
      if (playerBottomPrev <= oy + 1 && player.vy >= 0) {
        player.y = oy - player.h;
        player.vy = 0;
        player.onGround = true;
      } else {
        if (player.vx > 0) player.x = o.x - player.w - 0.1;
        else if (player.vx < 0) player.x = o.x + o.w + 0.1;
        if (player.hurtT <= 0) {
          player.hurtT = 0.5;
          player.vy = -4;
          player.onGround = false;
          showToast('Hoppla! 😅', 700);
        }
      }
    }
  }

  for (const it of things) {
    if (it.collected) continue;
    if (it.type === 'item' || it.type === 'npc') {
      const iy = gy + (it.y || -8);
      const iw = it.type==='npc' ? 10 : 10;
      const ih = it.type==='npc' ? 14 : 10;
      const ix = it.x;
      if (player.x + player.w > ix && player.x < ix + iw &&
          player.y + player.h > iy && player.y < iy + ih) {
        it.collected = true;
        if (it.type === 'item') {
          score++;
          hudScore.textContent = score;
          const labels = { beer:'+1 🍺 Bier!', brezn:'+1 🥨 Brezn!', leberkaes:'+1 🥩 Leberkäs!',
                           heart:'+1 ❤️', star:'+1 ⭐', dmark:'+1 💰 D-Mark!' };
          showToast(labels[it.kind] || '+1', 900);
        } else if (it.type === 'npc') {
          const greets = {
            dorothee:'Servus Dorothee! ❤️',
            martin:  'Hallo Martin! 👋',
            hannah:  'Hi Opa! – Hannah 🌸',
            linda:   'Hi Opa! – Linda 🌸',
            lurch:   'Der Lurch! 🦎',
          };
          showToast(greets[it.kind] || 'Hallo!', 1400);
        }
      }
    }
  }

  for (const g of things) {
    if (g.type === 'goal' && !finished) {
      const gx = g.x;
      if (player.x + player.w > gx && player.x < gx + 36) {
        finished = true;
        running = false;
        showEnd();
      }
    }
  }

  const targetCam = player.x - VIEW_W / 3;
  camX += (targetCam - camX) * 0.18;
  if (camX < 0) camX = 0;
  const maxCam = WORLD_END - VIEW_W;
  if (camX > maxCam) camX = maxCam;

  updateEraLabel();
}

function render() {
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);

  const blend = eraBlend(player.x);
  const sky = lerpColor(blend.era.sky, blend.next.sky, blend.t);
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);

  if (currentEra(player.x).name.includes('Mondlandung')) {
    for (const s of stars) {
      const sx = s.x - camX;
      if (sx > -2 && sx < VIEW_W) px(sx, s.y, 1, 1, '#ffffff');
    }
    px(VIEW_W - 50, 18, 18, 18, '#e8e8d0');
    px(VIEW_W - 46, 20, 4, 4, '#c8c8b0');
    px(VIEW_W - 38, 26, 6, 4, '#c8c8b0');
  }

  for (const c of clouds) drawCloud(c, camX);
  drawMountains(camX);

  const gy = VIEW_H - GROUND_H;
  const ground = lerpColor(blend.era.ground, blend.next.ground, blend.t);
  ctx.fillStyle = ground;
  ctx.fillRect(0, gy, VIEW_W, GROUND_H);
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.fillRect(0, gy, VIEW_W, 2);

  ctx.save();
  ctx.translate(-camX, 0);
  for (const t of things) {
    const sx = t.x;
    if (sx - camX < -120 || sx - camX > VIEW_W + 120) continue;
    if (t.type === 'scenery') {
      switch (t.kind) {
        case 'church': drawChurch(sx, gy); break;
        case 'kaefer': drawKaefer(sx, gy); break;
        case 'rocket': drawRocket(sx, gy); break;
        case 'truck':  drawTruck(sx, gy); break;
        case 'muetze': drawMuetze(sx, gy); break;
        case 'crane':  drawCrane(sx, gy); break;
        case 'truckBoegl': drawTruckBoegl(sx, gy); break;
        case 'gate':   drawGate(sx, gy); break;
        case 'banner': drawBanner(sx, gy); break;
      }
    } else if (t.type === 'sign') {
      drawSign(sx, gy, t.text);
    } else if (t.type === 'obstacle') {
      drawObstacle(t, gy);
    } else if (t.type === 'item' && !t.collected) {
      drawItem(t, sx, gy + (t.y || -8));
    } else if (t.type === 'npc' && !t.collected) {
      switch (t.kind) {
        case 'dorothee': drawDorothee(sx, gy); break;
        case 'martin':   drawMartin(sx, gy); break;
        case 'hannah':   drawHannah(sx, gy); break;
        case 'linda':    drawLinda(sx, gy); break;
        case 'lurch':    drawLurch(sx, gy); break;
      }
    } else if (t.type === 'goal') {
      drawCake(sx, gy);
    }
  }
  drawJosef();
  ctx.restore();

  ctx.setTransform(1,0,0,1,0,0);
}

function loop(t) {
  if (!prevTime) prevTime = t;
  const dt = Math.min(0.05, (t - prevTime) / 1000);
  prevTime = t;
  if (running) update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function showEnd() {
  overlay.classList.remove('hidden');
  controls.classList.add('hidden');
  const totalItems = things.filter(t => t.type==='item').length;
  const collectedItems = things.filter(t => t.type==='item' && t.collected).length;
  const npcs = things.filter(t => t.type==='npc' && t.collected).map(t=>({
    dorothee:'Dorothee', martin:'Martin', hannah:'Hannah', linda:'Linda', lurch:'der Lurch'
  }[t.kind] || t.kind));
  let extras = '';
  if (npcs.length) extras = `<p class="small">Begegnet: ${npcs.join(', ')}</p>`;
  overlay.innerHTML = `
    <h1>🎂 Herzlichen Glückwunsch zum 70., Josef! 🎂</h1>
    <p>Von Sengenthal über Max Bögl bis zu Hannah und Linda – was für eine Reise.</p>
    <div class="end-stats">
      <h2>Erinnerungen: ${collectedItems} / ${totalItems}</h2>
    </div>
    ${extras}
    <p>Auf die nächsten Jahrzehnte – mit Lederhose, Schäufele und einer kühlen Maß. 🍺</p>
    <button id="restartBtn">Nochmal!</button>
  `;
  document.getElementById('restartBtn').addEventListener('click', restart);
}

function restart() {
  for (const t of things) t.collected = false;
  player.x = 30; player.y = 0; player.vx = 0; player.vy = 0; player.onGround = true;
  camX = 0; score = 0; finished = false; lastEraName = '';
  hudScore.textContent = 0;
  hudEra.textContent = '';
  overlay.innerHTML = `
    <h1>🎂 Alles Gute, Josef! 🎂</h1>
    <p><b>Eine kleine Zeitreise durch 70 Jahre</b> — vom Buam aus Sengenthal bis zum Opa von Hannah und Linda.</p>
    <p>Sammle Erinnerungen, spring über Hindernisse, lauf bis zur Geburtstagstorte.</p>
    <p class="small">Tippe ▶ zum Laufen, ▲ zum Springen. Am PC: Pfeiltasten + Leertaste.</p>
    <button id="startBtn">Los geht's!</button>
  `;
  document.getElementById('startBtn').addEventListener('click', start);
  overlay.classList.remove('hidden');
}

function start() {
  overlay.classList.add('hidden');
  controls.classList.remove('hidden');
  running = true;
}

document.getElementById('startBtn').addEventListener('click', start);
</script>
</body>
