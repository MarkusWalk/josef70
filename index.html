function currentEra(x) {
  let e = ERAS[0];
  for (const era of ERAS) { if (x >= era.start) e = era; }
  return e;
}
function nextEra(x) {
  for (let i = 0; i < ERAS.length; i++) { if (x < ERAS[i].start) return ERAS[i]; }
  return null;
}
function eraBlend(x) {
  const cur = currentEra(x), nxt = nextEra(x);
  if (!nxt) return { era: cur, next: cur, t: 0 };
  const dist = nxt.start - x;
  if (dist > 120) return { era: cur, next: nxt, t: 0 };
  return { era: cur, next: nxt, t: 1 - dist / 120 };
}
function lerpColor(a, b, t) {
  const parse = c => c.startsWith('#')
    ? [parseInt(c.slice(1,3),16), parseInt(c.slice(3,5),16), parseInt(c.slice(5,7),16)]
    : [0,0,0];
  const [ar,ag,ab] = parse(a), [br,bg,bb] = parse(b);
  return `rgb(${Math.round(ar+(br-ar)*t)},${Math.round(ag+(bg-ag)*t)},${Math.round(ab+(bb-ab)*t)})`;
}

function bindBtn(id, key) {
  const el = document.getElementById(id);
  const set = v => () => { input[key] = v; if (key==='jump' && v) input.jumpPressed = true; };
  el.addEventListener('touchstart', e=>{ e.preventDefault(); set(true)(); }, {passive:false});
  el.addEventListener('touchend',   e=>{ e.preventDefault(); set(false)(); }, {passive:false});
  el.addEventListener('touchcancel',e=>{ e.preventDefault(); set(false)(); }, {passive:false});
  el.addEventListener('mousedown',  set(true));
  el.addEventListener('mouseup',    set(false));
  el.addEventListener('mouseleave', set(false));
}

  if (e.key===' ' || e.key==='ArrowUp' || e.key==='w') { if(!input.jump) input.jumpPressed = true; input.jump = true; }
});
window.addEventListener('keyup', e=>{

});

function px(x, y, w, h, color) { ctx.fillStyle = color; ctx.fillRect(x, y, w, h); }

function spr(grid, x, y, palette, flipX=false) {
  for (let r=0; r<grid.length; r++){
    const row = grid[r];
    for (let c=0; c<row.length; c++){
      const ch = row[c];
      if (ch===' '||ch==='.') continue;
      const col = palette[ch];
      if (!col) continue;
      const dx = flipX ? (grid[0].length - 1 - c) : c;
      ctx.fillStyle = col;
      ctx.fillRect(x + dx, y + r, 1, 1);
    }
  }
}

  if (btn) { btn.disabled = false; btn.textContent = "Auf geht's, alter Mann! 💪"; }
}
function setStartFailed() {
  const btn = document.getElementById('startBtn');
  if (btn) { btn.disabled = false; btn.textContent = "Los geht's (ohne Foto)"; }
}

(async () => {
  try {
    await new Promise((resolve, reject) => {
      josefImg.onload = resolve;
      josefImg.onerror = reject;
      josefImg.src = 'josef.png';
    });
    if (josefImg.decode) { try { await josefImg.decode(); } catch (e) {} }
    josefImgReady = true;
    setStartReady();
  } catch (e) {
    console.warn('Josef-Foto nicht ladbar — Pixel-Kopf bleibt');
    setStartFailed();
  }
})();

function drawJosef() {
  const grid = !player.onGround ? JOSEF_JUMP
    : (Math.abs(player.vx) > 0.5 ? (Math.floor(player.walkPhase) % 2 === 0 ? JOSEF_WALK : JOSEF_STAND) : JOSEF_STAND);
  if (player.hurtT > 0 && Math.floor(player.hurtT * 20) % 2 === 0) return;
  const px0 = Math.round(player.x), py0 = Math.round(player.y);
  const pal = josefImgReady ? JOSEF_PAL_BODY : JOSEF_PAL_FULL;
  spr(grid, px0, py0, pal, player.facing < 0);
  if (josefImgReady) {
    const hw = 20, hh = 20;
    const hx = px0 + (12 - hw) / 2;
    const hy = py0 - 8;
    if (player.facing < 0) {
      ctx.save();
      ctx.translate(hx + hw, hy);
      ctx.scale(-1, 1);
      ctx.drawImage(josefImg, 0, 0, hw, hh);
      ctx.restore();
    } else {
      ctx.drawImage(josefImg, hx, hy, hw, hh);
    }
  }
}

function drawSign(x, gy, text) {
  px(x+5, gy-22, 2, 22, '#6a4a20');
  const w = Math.min(100, Math.max(46, text.length * 4 + 10));
  px(x-w/2+6, gy-34, w, 12, '#c89858');
  px(x-w/2+6, gy-34, w, 1,  '#7a5828');
  px(x-w/2+6, gy-23, w, 1,  '#7a5828');
  ctx.fillStyle = '#3a2410';
  ctx.font = 'bold 7px monospace';
  ctx.textBaseline = 'top';
  ctx.textAlign = 'center';
  ctx.fillText(text, x+6, gy-32);
}

function drawFirework(x, sy) {
  // Feuerwerk explodierend
  const colors = ['#ffd700','#c83030','#3464a8','#ff8030','#88e8ff'];
  for (let i=0;i<10;i++) {
    const a = i / 10 * Math.PI * 2;
    const r = 10;
    const fx = x + Math.cos(a)*r;
    const fy = sy + Math.sin(a)*r;
    px(fx, fy, 2, 2, colors[i % colors.length]);
  }
  px(x-1, sy-1, 3, 3, '#fff');
}

  px(x+6, gy-40, 4, 4, '#caa030');
  px(x+7, gy-39, 2, 2, '#ffd700');
}

function drawCradle(x, gy) {
  // Wiege mit Baby Martin
  // Beine
  px(x+1, gy-4, 2, 4, '#7a4a20');
  px(x+21, gy-4, 2, 4, '#7a4a20');
  // Korb
  px(x, gy-16, 24, 12, '#caa078');
  px(x, gy-16, 24, 2, '#a87838');
  px(x, gy-6, 24, 2, '#7a5828');
  // Gitterstäbe
  for (let i=0;i<6;i++) px(x+2+i*4, gy-14, 1, 8, '#7a5828');
  // Decke
  px(x+4, gy-14, 16, 4, '#a0d8e8');
  px(x+4, gy-14, 16, 1, '#88c8e0');
  // Baby Kopf
  px(x+10, gy-20, 4, 4, '#f4caa0');
  px(x+9, gy-21, 6, 1, '#caa050');
  px(x+11, gy-19, 1, 1, '#000');
  px(x+12, gy-19, 1, 1, '#000');
  // Schnuller
  px(x+11, gy-17, 2, 1, '#ff8888');
  // "Martin" Schild
  ctx.fillStyle='#fff'; ctx.font='bold 6px monospace'; ctx.textAlign='center';
  ctx.fillText('Martin', x+12, gy-26);
}

function drawHannah(x, gy) {
  // Kleines Mädchen mit Zopf in rosa
  // Beine
  px(x+4, gy-8, 2, 8, '#f4caa0');
  px(x+8, gy-8, 2, 8, '#f4caa0');
  // Schuhe
  px(x+3, gy-2, 3, 2, '#c83030');
  px(x+8, gy-2, 3, 2, '#c83030');
  // Kleid rosa
  px(x+2, gy-18, 10, 10, '#ff88a8');
  px(x+1, gy-12, 12, 2, '#ff88a8');
  // Gesicht
  px(x+3, gy-26, 8, 8, '#f4caa0');
  px(x+5, gy-24, 1, 1, '#000');
  px(x+8, gy-24, 1, 1, '#000');
  px(x+5, gy-21, 4, 1, '#a83030');
  // Haare blond mit Zopf
  px(x+2, gy-28, 10, 4, '#e8c870');
  px(x+1, gy-26, 2, 6, '#e8c870');
  px(x+11, gy-26, 2, 6, '#e8c870');
  // Schleife
  px(x+11, gy-28, 3, 2, '#c83030');
  // Schild
  ctx.fillStyle='#fff'; ctx.font='bold 7px monospace'; ctx.textAlign='center';
  ctx.fillText('Hannah', x+7, gy-36);
}

function drawLinda(x, gy) {
  // Kleines Mädchen mit Zopf in lila
  // Beine
  px(x+4, gy-8, 2, 8, '#f4caa0');
  px(x+8, gy-8, 2, 8, '#f4caa0');
  // Schuhe
  px(x+3, gy-2, 3, 2, '#3464a8');
  px(x+8, gy-2, 3, 2, '#3464a8');
  // Kleid lila
  px(x+2, gy-18, 10, 10, '#b888d8');
  px(x+1, gy-12, 12, 2, '#b888d8');
  // Gesicht
  px(x+3, gy-26, 8, 8, '#f4caa0');
  px(x+5, gy-24, 1, 1, '#000');
  px(x+8, gy-24, 1, 1, '#000');
  px(x+5, gy-21, 4, 1, '#a83030');
  // Haare braun mit Zöpfen
  px(x+2, gy-28, 10, 4, '#8a5a20');
  px(x+0, gy-26, 2, 8, '#8a5a20');
  px(x+12, gy-26, 2, 8, '#8a5a20');
  // Schleife
  px(x+0, gy-28, 3, 2, '#88c8a8');
  // Schild
  ctx.fillStyle='#fff'; ctx.font='bold 7px monospace'; ctx.textAlign='center';
  ctx.fillText('Linda', x+7, gy-36);
}

function drawObstacle(o, gy) {
  if (o.kind === 'stone') {
    px(o.x, gy-o.h, o.w, o.h, '#888');
    px(o.x, gy-o.h, o.w, 2, '#aaa');
    px(o.x, gy-2, o.w, 2, '#666');
  } else if (o.kind === 'crater') {
    px(o.x, gy-2, o.w, 2, '#3a3a3a');
    px(o.x+2, gy-4, o.w-4, 2, '#5a5a5a');
  } else if (o.kind === 'wallLow' || o.kind === 'wallBroken') {
    for (let i=0;i<o.h;i+=6) {
      px(o.x, gy-o.h+i, o.w, 5, i%12===0 ? '#d0d0d0':'#b8b8b8');
    }
    px(o.x+2, gy-o.h+8, 3, 3, '#c83030');
    px(o.x+6, gy-o.h+14, 3, 3, '#3464a8');
    px(o.x+3, gy-o.h+22, 4, 2, '#caa030');
  } else if (o.kind === 'saber') {
    px(o.x+4, gy-4, 6, 4, '#3a3a3a');
    px(o.x+5, gy-o.h, 4, o.h-4, '#88e8ff');
    px(o.x+6, gy-o.h, 2, o.h-4, '#ffffff');
  }
}

function drawCake(x, gy) {
  px(x-4,  gy-2,  40, 2,  '#caa030');
  px(x,    gy-14, 32, 12, '#f4e8c8');
  px(x+2,  gy-20, 28, 6,  '#e8a8c8');
  px(x+4,  gy-30, 24, 10, '#f4e8c8');
  px(x+6,  gy-34, 20, 4,  '#e8a8c8');
  for (let i=0;i<7;i++){
    const cx = x+6 + i*3;
    px(cx, gy-40, 1, 6, '#3464a8');
    px(cx, gy-42, 1, 2, '#ffaa20');
    px(cx-1, gy-41, 3, 1, '#ffe080');
  }
  ctx.fillStyle='#a83030'; ctx.font='bold 10px monospace'; ctx.textAlign='center';
  ctx.fillText('70', x+16, gy-7);
}

const clouds = [];
for (let i=0;i<32;i++) clouds.push({ x: Math.random()*WORLD_END, y: 14 + Math.random()*40, w: 16+Math.random()*22 });
const moonStars = [];
for (let i=0;i<80;i++) moonStars.push({ x: 3000 + Math.random()*600, y: 10 + Math.random()*80 });
const swStars = [];
for (let i=0;i<60;i++) swStars.push({ x: 4800 + Math.random()*600, y: 10 + Math.random()*70 });
const milStars = [];
for (let i=0;i<70;i++) milStars.push({ x: 7500 + Math.random()*600, y: 10 + Math.random()*80 });
const sputnikStars = [];
for (let i=0;i<60;i++) sputnikStars.push({ x: 600 + Math.random()*600, y: 8 + Math.random()*70 });

function drawCloud(c, camX) {
  const x = c.x - camX*0.4;
  if (x + c.w < -10 || x > VIEW_W+10) return;
  px(x, c.y, c.w, 4, '#ffffff');
  px(x+2, c.y-2, c.w-4, 2, '#ffffff');
  px(x+4, c.y+4, c.w-8, 2, '#e8e8f0');
}

function drawMountains(camX) {
  const baseY = VIEW_H - GROUND_H;
  ctx.fillStyle = '#6a7a98';
  for (let i=0;i<10;i++){
    const mx = (i*180 - (camX*0.2 % 180)) | 0;
    const h = 40 + (i%3)*8;
    ctx.beginPath();
    ctx.moveTo(mx, baseY);
    ctx.lineTo(mx+40, baseY - h);
    ctx.lineTo(mx+90, baseY);
    ctx.closePath();
    ctx.fill();
  }
  ctx.fillStyle = '#3a5a3a';
  for (let i=0;i<12;i++){
    const mx = (i*120 - (camX*0.4 % 120)) | 0;
    const h = 22 + (i%2)*8;
    ctx.beginPath();
    ctx.moveTo(mx, baseY);
    ctx.lineTo(mx+30, baseY - h);
    ctx.lineTo(mx+70, baseY);
    ctx.closePath();
    ctx.fill();
  }
}

let camX = 0;
let score = 0;
let stumbles = 0;
let startTime = 0;
let elapsedAtEnd = 0;
let prevTime = 0;
let running = false;
let finished = false;

function showToast(msg, dur=1400) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>toastEl.classList.remove('show'), dur);
}

// Fitness-Joke-Toasts beim Loslaufen / nach Stolperern
const SCHNAUF_LINES = [
  'Schnauf... 😮‍💨',
  'Halt durch, Josef!',
  'Geht doch noch! 💪',
  'Knie, halt durch...',
  'Wo ist die Lesebrille?',
  'Hatte ich Tabletten heute?',
  'Bin ich schon im Ziel?',
];

let lastEraName = '';
function updateEraLabel() {
  const e = currentEra(player.x).name;
  if (e !== lastEraName) {
    lastEraName = e;
    hudEra.textContent = e;
    showToast(e, 1600);
  }
}

let schnaufTimer = 0;

function update(dt) {
  schnaufTimer -= dt;
  let ax = 0;
  if (input.left) ax -= 1;
  if (input.right) ax += 1;
  player.vx = ax * RUN_SPEED;
  if (ax > 0) player.facing = 1;
  else if (ax < 0) player.facing = -1;

  // Gelegentlich ein Schnaufer-Toast
  if (Math.abs(player.vx) > 0.5 && schnaufTimer <= 0 && Math.random() < 0.005) {
    showToast(SCHNAUF_LINES[Math.floor(Math.random() * SCHNAUF_LINES.length)], 1000);
    schnaufTimer = 8;
  }

  if (player.onGround && input.jumpPressed) {
    player.vy = JUMP_V;
    player.onGround = false;
  }
  input.jumpPressed = false;
  if (!input.jump && player.vy < -3) player.vy = -3;

  player.vy += GRAVITY;
  if (player.vy > 12) player.vy = 12;
  player.x += player.vx;
  player.y += player.vy;
  if (Math.abs(player.vx) > 0.1) player.walkPhase += Math.abs(player.vx) * 0.18;

  if (player.x < 0) player.x = 0;
  if (player.x > WORLD_END - player.w) player.x = WORLD_END - player.w;

  const gy = VIEW_H - GROUND_H;
  if (player.y + player.h >= gy) {
    player.y = gy - player.h;
    player.vy = 0;
    player.onGround = true;
  } else {
    player.onGround = false;
  }

  if (player.hurtT > 0) player.hurtT -= dt;
  for (const o of things) {
    if (o.type !== 'obstacle') continue;
    const oy = gy - o.h;
    if (player.x + player.w > o.x && player.x < o.x + o.w &&
        player.y + player.h > oy && player.y < oy + o.h) {
      const playerBottomPrev = (player.y + player.h) - player.vy;
      if (playerBottomPrev <= oy + 1 && player.vy >= 0) {
        player.y = oy - player.h;
        player.vy = 0;
        player.onGround = true;
      } else {
        if (player.vx > 0) player.x = o.x - player.w - 0.1;
        else if (player.vx < 0) player.x = o.x + o.w + 0.1;
        if (player.hurtT <= 0) {
          player.hurtT = 0.5;
          player.vy = -4;
          player.onGround = false;
          stumbles++;
          const stumbleToasts = ['Au, mei Hüft!', 'Hoppla! 🤕', 'Knie!', 'Verdammt...', 'Wo war der Stock?'];
          showToast(stumbleToasts[Math.floor(Math.random()*stumbleToasts.length)], 800);
        }
      }
    }
  }

  for (const it of things) {
    if (it.collected) continue;
    if (it.type === 'item') {
      const iy = gy + (it.y || -8);
      const ix = it.x;
      if (player.x + player.w > ix && player.x < ix + 10 &&
          player.y + player.h > iy && player.y < iy + 10) {
        it.collected = true;
        score++;
        hudScore.textContent = score;
        const labels = {
          star:'+1 ⭐', heart:'+1 ❤️', dmark:'+1 💰 D-Mark', vinyl:'+1 💿 Schallplatte',
          brezel:'+1 🥨 Brezn!', leberkaes:'+1 🥩 Leberkäs!',
          nurnberger:'+1 🌭 Nürnberger!', schaeufele:'+1 🍖 Schäufele!',
          turmeulen:'+1 🦉 Turmeule!', wellington:'+1 🥩 Wellington!',
          zipferl:'+1 🌶️ Saure Zipferl!', bier:'+1 🍺 Bier!',
        };
        showToast(labels[it.kind] || '+1', 800);
      }
    } else if (it.type === 'npc') {
      const ix = it.x;
      const iw = 20, ih = 40;
      if (player.x + player.w > ix - 4 && player.x < ix + iw &&
          player.y + player.h > gy - ih && player.y < gy) {
        it.collected = true;
        score++;
        hudScore.textContent = score;
        const greets = {
          bride:  'Ja, ich will! 💍 Dorothee ❤️',
          cradle: 'Hallo Papa! 👶 Martin',
          hannah: 'Hi Opa! 🌸 — Hannah',
          linda:  'Hi Opa! 🌸 — Linda',
        };
        showToast(greets[it.kind] || 'Hallo!', 1400);
      }
    }
  }

  for (const g of things) {
    if (g.type === 'goal' && !finished) {
      if (player.x + player.w > g.x && player.x < g.x + 36) {
        finished = true;
        running = false;
        elapsedAtEnd = (performance.now() - startTime) / 1000;
        showEnd();
      }
    }
  }

  const targetCam = player.x - VIEW_W / 3;
  camX += (targetCam - camX) * 0.18;
  if (camX < 0) camX = 0;
  const maxCam = WORLD_END - VIEW_W;
  if (camX > maxCam) camX = maxCam;

  updateEraLabel();
}

function render() {
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);

  const blend = eraBlend(player.x);
  const sky = lerpColor(blend.era.sky, blend.next.sky, blend.t);
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);

  const curName = currentEra(player.x).name;

  // Nacht-Sterne in dunklen Eras
  function drawStars(arr) {
    for (const s of arr) {
      const sx = s.x - camX;
      if (sx > -2 && sx < VIEW_W) px(sx, s.y, 1, 1, '#ffffff');
    }
  }
  if (curName.includes('Sputnik'))     drawStars(sputnikStars);
  if (curName.includes('Mondlandung')) { drawStars(moonStars);
    px(VIEW_W - 50, 18, 18, 18, '#e8e8d0');
    px(VIEW_W - 46, 20, 4, 4, '#c8c8b0');
    px(VIEW_W - 38, 26, 6, 4, '#c8c8b0');
  }
  if (curName.includes('Star Wars'))   drawStars(swStars);
  if (curName.includes('Millennium'))  drawStars(milStars);

  for (const c of clouds) drawCloud(c, camX);
  drawMountains(camX);

  const gy = VIEW_H - GROUND_H;
  const ground = lerpColor(blend.era.ground, blend.next.ground, blend.t);
  ctx.fillStyle = ground;
  ctx.fillRect(0, gy, VIEW_W, GROUND_H);
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.fillRect(0, gy, VIEW_W, 2);

  ctx.save();
  ctx.translate(-camX, 0);
  for (const t of things) {
    if (t.x - camX < -150 || t.x - camX > VIEW_W + 150) continue;
    if (t.type === 'scenery') {
      const sx = t.x, sy = gy + (t.y || 0);
      switch (t.kind) {
        case 'church':          drawChurch(sx, gy); break;
        case 'kaefer':          drawKaefer(sx, gy); break;
        case 'sputnik':         drawSputnik(sx, sy); break;
        case 'mauerbau':        drawMauerbau(sx, gy); break;
        case 'kennedy':         drawKennedy(sx, gy); break;
        case 'krapfen':         drawKrapfen(sx, sy); break;
        case 'beatles':         drawBeatles(sx, gy); break;
        case 'rocket':          drawRocket(sx, gy); break;
        case 'astronaut':       drawAstronaut(sx, gy); break;
        case 'rings':           drawRings(sx, gy); break;
        case 'waldi':           drawWaldi(sx, gy); break;
        case 'horseRider':      drawHorseRider(sx, gy); break;
        case 'emptyAutobahn':   drawEmptyAutobahn(sx, gy); break;
        case 'xwing':           drawXwing(sx, gy); break;
        case 'vader':           drawVader(sx, gy); break;
        case 'balloon':         drawBalloon(sx, sy); break;
        case 'gate':            drawGate(sx, gy); break;
        case 'trabi':           drawTrabi(sx, gy); break;
        case 'firework':        drawFirework(sx, sy); break;
        case 'selfie':          drawSelfie(sx, gy); break;
        case 'sofa':            drawSofa(sx, gy); break;
        case 'tvBig':           drawTvBig(sx, gy); break;
        case 'chapel':          drawChapel(sx, gy); break;
        case 'bride':           drawBride(sx, gy); break;
        case 'cradle':          drawCradle(sx, gy); break;
        case 'hannah':          drawHannah(sx, gy); break;
        case 'linda':           drawLinda(sx, gy); break;
        case 'banner':          drawBanner(sx, gy); break;
      }
    } else if (t.type === 'sign') {
      drawSign(t.x, gy, t.text);
    } else if (t.type === 'obstacle') {
      drawObstacle(t, gy);
    } else if (t.type === 'item' && !t.collected) {
      drawItem(t, t.x, gy + (t.y || -8));
    } else if (t.type === 'npc' && !t.collected) {
      const sx = t.x;
      switch (t.kind) {
        case 'bride':  drawBride(sx, gy); break;
        case 'cradle': drawCradle(sx, gy); break;
        case 'hannah': drawHannah(sx, gy); break;
        case 'linda':  drawLinda(sx, gy); break;
      }
    } else if (t.type === 'goal') {
      drawCake(t.x, gy);
    }
  }
  drawJosef();
  ctx.restore();

  ctx.setTransform(1,0,0,1,0,0);
}

function loop(t) {
  if (!prevTime) prevTime = t;
  const dt = Math.min(0.05, (t - prevTime) / 1000);
  prevTime = t;
  if (running) update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function fitnessVerdict(score, stumbles, time) {
  const totalItems = things.filter(t => t.type==='item').length;
  const pct = score / totalItems;
  // Verdict
  let verdict, comment;
  if (pct >= 0.85 && stumbles <= 2 && time < 90) {
    verdict = '🏆 Olympia-reif!';
    comment = 'Du bist ja noch jünger als Hannah und Linda. Die 70 kann kommen — Bratwürste sind dir sicher.';
  } else if (pct >= 0.7 && stumbles <= 4) {
    verdict = '💪 Fit wie ein Turnschuh!';
    comment = 'Mit der Performance darfst du morgen ohne Bedenken den 70. feiern. Vielleicht sogar Tanzen.';
  } else if (pct >= 0.5) {
    verdict = '👍 Geht noch!';
    comment = 'Solides Mittelfeld. Eine Maß zum Mittag, ein Schläfchen nach — alles im grünen Bereich.';
  } else if (stumbles >= 6) {
    verdict = '🦴 Knie-Check empfohlen';
    comment = 'Die Hüfte hat geknirscht, der Stock ist verschollen. Trotzdem: 70 ist ein guter Grund zum Feiern.';
  } else {
    verdict = '🛋️ Couch-Modus';
    comment = 'Ehrlich gesagt — bleib morgen lieber auf der Couch und lass dich bedienen. Hast du dir verdient.';
  }
  return { verdict, comment, pct, totalItems };
}

function showEnd() {
  overlay.classList.remove('hidden');
  controls.classList.add('hidden');
  const v = fitnessVerdict(score, stumbles, elapsedAtEnd);
  const mins = Math.floor(elapsedAtEnd / 60);
  const secs = Math.floor(elapsedAtEnd % 60).toString().padStart(2,'0');
  overlay.innerHTML = `
    <h1>🎂 Die Diagnose 🎂</h1>
    <p>70 Jahre durchgelaufen — von Wirtschaftswunder bis morgen.</p>
    <div class="stats">
      <div class="verdict">${v.verdict}</div>
      <p style="margin:6px 0">${v.comment}</p>
    </div>
    <div class="stats">
      <p>⭐ Erinnerungen: <b>${score} / ${v.totalItems}</b></p>
      <p>🤕 Stolperer: <b>${stumbles}</b></p>
      <p>⏱️ Zeit: <b>${mins}:${secs}</b></p>
    </div>
    <p style="font-size:14px;opacity:.9">Alles Gute zum 70., Josef! 🍻</p>
    <button id="restartBtn">Nochmal!</button>
  `;
  document.getElementById('restartBtn').addEventListener('click', restart);
}

function restart() {
  for (const t of things) t.collected = false;
  player.x = 30; player.y = 0; player.vx = 0; player.vy = 0; player.onGround = true;
  camX = 0; score = 0; stumbles = 0; finished = false; lastEraName = '';
  hudScore.textContent = 0;
  hudEra.textContent = '';
  overlay.innerHTML = `
    <h1>🏃‍♂️ Josefs großer Fitness-Test 🏃‍♂️</h1>
    <p><b>Morgen wirst du 70.</b> Aber bist du noch fit genug dafür?</p>
    <p>Lauf durch dein Leben – von '56 bis morgen – und beweis dass du's noch drauf hast. Wir messen Sterne ⭐, Stolperer 🤕 und Zeit ⏱️.</p>
    <p class="small">Tippe ▶ zum Laufen, ▲ zum Springen. PC: Pfeiltasten + Leertaste.</p>
    <button id="startBtn" disabled>Lade Josef...</button>
  `;
  document.getElementById('startBtn').addEventListener('click', start);
  overlay.classList.remove('hidden');
}

function start() {
  overlay.classList.add('hidden');
  controls.classList.remove('hidden');
  running = true;
  startTime = performance.now();
}

document.getElementById('startBtn').addEventListener('click', start);
</script>
